<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Search Tool - By @RDXallhacknew</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h2 {
            color: #38bdf8;
            margin-bottom: 20px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #475569;
            border-radius: 6px;
            background-color: #0f172a;
            color: #fff;
            font-size: 16px;
        }
        input[type="text"]:focus {
            outline: 2px solid #38bdf8;
        }
        button {
            padding: 12px 20px;
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0ea5e9;
        }
        .result-box {
            margin-top: 20px;
            text-align: left;
            background-color: #0f172a;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #334155;
            max-height: 250px;
            overflow-y: auto;
        }
        pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #4ade80;
            font-family: 'Courier New', Courier, monospace;
        }
        .footer {
            margin-top: 25px;
            font-size: 14px;
            color: #94a3b8;
            border-top: 1px solid #334155;
            padding-top: 15px;
        }
        .footer a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>API Data Fetcher</h2>
    
    <div class="search-box">
        <input type="text" id="searchTerm" placeholder="Enter term (e.g., @ownbakchodi2)" value="@ownbakchodi2">
        <button onclick="fetchData()">Search</button>
    </div>

    <div class="result-box">
        <pre id="output">API Response will appear here...</pre>
    </div>

    <div class="footer">
        Developed and Managed By: <a href="#">@RDXallhacknew</a>
    </div>
</div>

<script>
    async function fetchData() {
        const termInput = document.getElementById('searchTerm').value.trim();
        const outputElement = document.getElementById('output');

        if (!termInput) {
            outputElement.innerText = "Please enter a search term.";
            return;
        }

        outputElement.innerText = "Fetching data... Please wait.";

        // আপনার দেওয়া API URL এবং কুয়েরি প্যারামিটার তৈরি করা হচ্ছে
        const apiUrl = `https://tg2num-eight.vercel.app/sms?key=PRIME&term=${encodeURIComponent(termInput)}`;

        try {
            const response = await fetch(apiUrl);
            
            if (!response.ok) {
                throw new Error(`HTTP Error! Status: ${response.status}`);
            }

            const data = await response.json();
            
            // JSON রেসপন্সটি স্ক্রিনে সুন্দরভাবে প্রিন্ট করা হচ্ছে
            outputElement.innerText = JSON.stringify(data, null, 4);

        } catch (error) {
            outputElement.innerText = "Error fetching data: " + error.message;
        }
    }
</script>

</body>
</html>
