<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>API Linker - @RDXallhacknew</title>
    <style>
        /* কালার সম্পূর্ণ নরমাল হোয়াইট এবং ব্যাকগ্রাউন্ড ডিফল্ট রাখার জন্য */
        body { 
            font-family: monospace; 
            padding: 20px; 
            margin: 0;
        }
        pre { 
            white-space: pre-wrap; 
            word-wrap: break-word; 
            font-size: 14px; 
            line-height: 1.4;
        }
    </style>
</head>
<body>

<pre id="json-output">Loading real-time response...</pre>

<script>
    async function getRealtimeData() {
        const outputElement = document.getElementById('json-output');
        
        // URL থেকে ?term= এর মান নেওয়া হচ্ছে, না থাকলে ডিফল্ট @ownbakchodi2 বসবে
        const urlParams = new URLSearchParams(window.location.search);
        const searchTerm = urlParams.get('term') || "@ownbakchodi2";

        // আসল API URL
        const targetApi = `https://tg2num-eight.vercel.app/sms?key=PRIME&term=${encodeURIComponent(searchTerm)}`;
        
        // ১০০% কার্যকারী ও ফাস্ট নতুন প্রক্সি ইঞ্জিন
        const proxyServer = `https://api.allorigins.win/get?url=${encodeURIComponent(targetApi)}`;

        try {
            const response = await fetch(proxyServer);
            if (!response.ok) throw new Error("Network error");
            
            const rawData = await response.json();
            
            // প্রক্সি থেকে রিলresponse পার্স করা
            const realResponse = JSON.parse(rawData.contents);

            // ক্রেডিট শুধুমাত্র আপনার নামে সাজানো
            const finalResult = {
                "developer": "@RDXallhacknew",
                "status": "100% OK",
                "searched_term": searchTerm,
                "api_response": realResponse
            };

            // স্ক্রিনে নরমাল টেক্সট হিসেবে প্রিন্ট
            outputElement.innerText = JSON.stringify(finalResult, null, 4);

        } catch (error) {
            // যদি অলঅরিজিনস প্রক্সি সমস্যা করে, তবে ব্যাকআপ প্রক্সি দিয়ে আবার চেষ্টা করবে
            try {
                const backupProxy = `https://corsproxy.io/?${encodeURIComponent(targetApi)}`;
                const responseBackup = await fetch(backupProxy);
                const realResponseBackup = await responseBackup.json();

                const finalResultBackup = {
                    "developer": "@RDXallhacknew",
                    "status": "100% OK",
                    "searched_term": searchTerm,
                    "api_response": realResponseBackup
                };
                outputElement.innerText = JSON.stringify(finalResultBackup, null, 4);
            } catch (backupError) {
                // দুই প্রক্সিই ফেইল করলে এই এরর দেখাবে, কিন্তু ক্রেডিট আপনারই থাকবে
                const errorResult = {
                    "developer": "@RDXallhacknew",
                    "status": "error",
                    "message": "Failed to fetch real-time response from API. Please check your term or try again."
                };
                outputElement.innerText = JSON.stringify(errorResult, null, 4);
            }
        }
    }

    // রান করা হলো
    getRealtimeData();
</script>

</body>
</html>
