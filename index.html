<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>API Response</title>
    <style>
        body { background: #000; color: #00ff00; font-family: 'Courier New', Courier, monospace; padding: 20px; }
        pre { white-space: pre-wrap; word-wrap: break-word; font-size: 14px; }
    </style>
</head>
<body>
    <pre id="output">Loading API Response...</pre>

    <script>
        async function fetchApi() {
            const urlParams = new URLSearchParams(window.location.search);
            const term = urlParams.get('term') || "@ownbakchodi2";
            const output = document.getElementById('output');

            // CORS বাইপাস করার জন্য একটি প্রক্সি সার্ভিস ব্যবহার করা হয়েছে
            const proxyUrl = "https://api.allorigins.win/get?url=";
            const targetUrl = `https://tg2num-eight.vercel.app/sms?key=PRIME&term=${encodeURIComponent(term)}`;

            try {
                const response = await fetch(proxyUrl + encodeURIComponent(targetUrl));
                const data = await response.json();
                const actualData = JSON.parse(data.contents);

                const finalOutput = {
                    "Developer": "@RDXallhacknew",
                    "Status": "100% Success",
                    "Response": actualData
                };

                output.innerText = JSON.stringify(finalOutput, null, 4);
            } catch (error) {
                output.innerText = "Error: API call failed. Please check your connection or API status.\n\nDeveloper: @RDXallhacknew";
            }
        }
        fetchApi();
    </script>
</body>
</html>
