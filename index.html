<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>API Endpoint</title>
</head>
<body>
<script>
    async function handleApiCall() {
        // URL থেকে 'term' প্যারামিটারটি নেওয়া হচ্ছে (যেমন: ?term=@ownbakchodi2)
        const urlParams = new URLSearchParams(window.location.search);
        let searchTerm = urlParams.get('term');

        // যদি ইউজার কোনো 'term' না দেয়, তবে ডিফল্ট হিসেবে '@ownbakchodi2' কাজ করবে
        if (!searchTerm) {
            searchTerm = "@ownbakchodi2";
        }

        const realApiUrl = `https://tg2num-eight.vercel.app/sms?key=PRIME&term=${encodeURIComponent(searchTerm)}`;

        try {
            const response = await fetch(realApiUrl);
            const realResponseData = await response.json();

            // আপনার নিজস্ব কাস্টম JSON ফরম্যাট তৈরি
            const finalJsonOutput = {
                "developer": "@RDXallhacknew",
                "status": "100% OK",
                "searched_term": searchTerm,
                "api_response": realResponseData
            };

            // কোনো পেজ বা ডিজাইন ছাড়াই সরাসরি ব্রাউজারে Raw JSON প্রিন্ট করা হচ্ছে
            document.body.innerHTML = `<pre style="word-wrap: break-word; white-space: pre-wrap; color: #00ff00; background: #000; padding: 20px; font-family: monospace;">${JSON.stringify(finalJsonOutput, null, 4)}</pre>`;

        } catch (error) {
            const errorJson = {
                "developer": "@RDXallhacknew",
                "status": "error",
                "message": "Failed to fetch real-time response from API."
            };
            document.body.innerHTML = `<pre style="color: red; background: #000; padding: 20px; font-family: monospace;">${JSON.stringify(errorJson, null, 4)}</pre>`;
        }
    }

    // ফাইলটি ওপেন হওয়া মাত্রই ফাংশনটি রান করবে
    handleApiCall();
</script>
</body>
</html>
